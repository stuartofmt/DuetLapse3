name: Release

# Publishes this repository's GitHub Release when a v* tag is pushed, or makes a test build when run by hand
# (Actions tab > Release > Run workflow). The work is done by the one shared release workflow in DWC-Tools, using this
# repository's plugin.json, its settings in scripts/ (release-channel.txt, release-exclude.txt, release-titles.txt)
# and its standalone/ folder. How to release, test builds and settings:
#   https://github.com/stuartofmt/DWC-Tools/blob/Prep_and_Package/.github/workflows/plugin-release.yml.md
# To tag a release, run scripts/release.sh (it runs the shared ~/DWC/Tools/Prep_and_Package/scripts/release.sh)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: Optional compatible DuetWebControl tag override; blank selects the highest compatible release
        required: false
        type: string
        default: ""

permissions:
  contents: write # create the Release and upload the ZIPs

jobs:
  release:
    # The version of the shared workflow. To try a change to it, point this @ref and tools-ref at a DWC-Tools branch
    uses: stuartofmt/DWC-Tools/.github/workflows/plugin-release.yml@workflow-v1
    with:
      dwc-ref: ${{ inputs.dwc-ref || '' }}
      tools-ref: workflow-v1
