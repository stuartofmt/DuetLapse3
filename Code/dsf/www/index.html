<!DOCTYPE html>
<!--
    duetLapse3 main page - the tabs fill "tab-content" from the other templates
    Placeholders: {{poll_ms}}
-->
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="frame-ancestors *:*"/>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;}
/*Style the tab*/
.tab{
overflow:hidden;
border:1px solid #ccc;
background-color:#f1f1f1;
}
/*Style the buttons inside the tab*/
.tab button{
background-color:inherit;
float:left;
border:none;
outline:none;
cursor:pointer;
padding:14px 16px;
transition:0.3s;
font-size:17px;
}
/*Change background color of buttons on hover*/
.tab button:hover{
background-color:#ddd;
}

/*Create an active/current tab link class*/
.tab button.active{
background-color:#ccc;
}

/*Style the tab content*/
.tabcontent{
padding:6px 12px;
border:1px solid #ccc;
background-color:lightblue;
border-top:none;
font-size:12px;
}

.button{
height:auto;
border-radius: 20px;
}
.inline{
margin-left: 5px; margin-bottom:8px;
display:inline-block;
}

form {
    display:grid;
    grid-template-columns: max-content max-content;
    grid-gap:10px;
}
form label {
   text-align:right;
}

/*Settings tables - Config and Video tabs*/
.config td {padding: 2px 6px; vertical-align: top;}
.config .help {color: #444;}
.config h4 {margin: 10px 0 2px 0;}
</style>
<script>
document.addEventListener("visibilitychange", function() {
if (!document.hidden){
    location.reload();
}
});
let nIntervalId;
function loadLasttab(evt) {
    clearInterval(nIntervalId);
    nIntervalId = undefined;
    let lastTab =sessionStorage.getItem("lastTab");
    let path =sessionStorage.getItem("path");
    if (path == null) {
        path = "true"
    }
    if (lastTab == "Status") {
        repeatDisplayStatus(event);
    } else if (lastTab == "Controls") {
        displayControls(event);
    } else if (lastTab == "Video") {
        displayVideo(event);
    } else if (lastTab == "Files") {
        displayFiles(event, path);
    } else if (lastTab == "Info") {
        displayInfo(event);
    } else if (lastTab == "Cameras") {
        displayCameras(event);
    } else if (lastTab == "Config") {
        displayConfig(event);
    } else {
        console.log("Default Tab");
        repeatDisplayStatus(event);
    }
}
function repeatDisplayStatus(evt){
    displayStatus();
    if (!nIntervalId) {
        nIntervalId = setInterval(displayStatus, {{poll_ms}} );
    }
}
async function displayStatus(evt){
    sessionStorage.setItem("lastTab", "Status");
    let content = document.getElementById("tab-content");
    const getUrl = "/tab/status";
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
async function displayControls(evt){
    sessionStorage.setItem("lastTab", "Controls");
    if (nIntervalId) {
        clearInterval(nIntervalId);
        nIntervalId = undefined;
    }
    let content = document.getElementById("tab-content");
    const getUrl = "/tab/controls";
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
async function displayVideo(evt){
    sessionStorage.setItem("lastTab", "Video");
    if (nIntervalId) {
        clearInterval(nIntervalId);
        nIntervalId = undefined;
    }
    let content = document.getElementById("tab-content");
    const getUrl = "/tab/video";
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
async function displayFiles(evt, path){
    sessionStorage.setItem("lastTab", "Files");
    sessionStorage.setItem("path", path);
    if (nIntervalId) {
        clearInterval(nIntervalId);
        nIntervalId = undefined;
    }
    let content = document.getElementById("tab-content");
    const getUrl = `/tab/files?path=${encodeURIComponent(path)}`;
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
async function displayInfo(evt){
    sessionStorage.setItem("lastTab", "Info");
    if (nIntervalId) {
        clearInterval(nIntervalId);
        nIntervalId = undefined;
    }
    let content = document.getElementById("tab-content");
    const getUrl = "/tab/info";
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
async function displayTerminate(evt){
    if (nIntervalId) {
        clearInterval(nIntervalId);
        nIntervalId = undefined;
    }
    let content = document.getElementById("tab-content");
    const getUrl = "/tab/terminate";
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
async function displayConfig(evt){
    sessionStorage.setItem("lastTab", "Config");
    if (nIntervalId) {
        clearInterval(nIntervalId);
        nIntervalId = undefined;
    }
    let content = document.getElementById("tab-content");
    const getUrl = "/tab/config";
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
async function displayCameras(evt){
    sessionStorage.setItem("lastTab", "Cameras");
    if (nIntervalId) {
        clearInterval(nIntervalId);
        nIntervalId = undefined;
    }
    let content = document.getElementById("tab-content");
    const getUrl = "/tab/cameras";
    let promise = await fetch(getUrl);
    let result = await promise.text();
    content.innerHTML = result;
}
// Show a new image from the url in camera n's box - duetLapse3 fetches it (see /camera/preview)
function previewCamera(n){
    const url = document.getElementById("weburl" + n).value.trim();
    const cell = document.getElementById("preview" + n);
    if (url == "") {
        cell.innerHTML = "No camera";
        return;
    }
    const src = "/camera/preview?url=" + encodeURIComponent(url) + "&t=" + Date.now();  // t stops the browser using an old image
    cell.innerHTML = `<a href="${src}" target="_blank"><img src="${src}" width="320" alt="No image from this url"></a>`;
}
// Save the camera urls, then show a new preview of each
async function saveCameras(){
    const settings = {weburl1: document.getElementById("weburl1").value, weburl2: document.getElementById("weburl2").value};
    let message = document.getElementById("camerasmessage");
    message.innerHTML = "Saving ...";
    let promise = await fetch("/cameras/save", {method: "POST", headers: {"Content-Type": "application/json"},
                                                body: JSON.stringify(settings)});
    message.innerHTML = await promise.text();
    previewCamera(1);
    previewCamera(2);
}
// Send the settings in a tab to be checked and saved - each input has name= and data-type=
// Returns the result message, which is also shown in messageId
async function saveSettings(containerId, url, messageId){
    const settings = {};
    for (const el of document.querySelectorAll("#" + containerId + " [name]")) {
        const type = el.dataset.type;
        if (type == "bool") {
            settings[el.name] = el.checked;
        } else if (type == "list") {
            (settings[el.name] = settings[el.name] || []).push(el.value);
        } else {
            settings[el.name] = el.value;
        }
    }
    let message = document.getElementById(messageId);
    message.innerHTML = "Saving ...";
    let promise = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"},
                                    body: JSON.stringify(settings)});
    let result = await promise.text();
    message.innerHTML = result;
    return result;
}
async function saveConfig(){
    await saveSettings("configform", "/config/save", "configmessage");
}
// The video length message can change, so the tab is reloaded after saving
async function saveVideo(){
    const result = await saveSettings("videoform", "/video/save", "videomessage");
    await displayVideo();
    document.getElementById("videomessage").innerHTML = result;
}
function imgTab(evt, src){
    window.open(src);
}
</script>
</head>
<body onload="loadLasttab()">
<div class="tab">
<button class="tablinks" onclick="repeatDisplayStatus(event)">Status</button>
<button class="tablinks" onclick="displayControls(event)">Controls</button>
<button class="tablinks" onclick="displayVideo(event)">Video</button>
<button class="tablinks" onclick="displayFiles(event,'true')">Files</button>
<button class="tablinks" onclick="displayInfo(event)">Info</button>
<button class="tablinks" onclick="displayCameras(event)">Cameras</button>
<button class="tablinks" onclick="displayConfig(event)">Config</button>
</div>
<div id="tab-content" class="tabcontent" style="width:inherit; max-height:200px; overflow-y:auto"></div>
</body>
</html>
