    Placeholders: {{vidmsg}} {{restartmsg}} {{pageaction}}
    The confirm text must stay on one line - use \n for line breaks
-->
<td>
<div class="inline">
<button class="button" style="background-color:green" onclick="(async () => {
if (confirm('Press OK to Gracefully Terminate\n{{vidmsg}}{{restartmsg}}')) {console.log('Graceful Terminate');fetch('/terminate/terminateg');{{pageaction}}} else {console.log('Abort Graceful Terminate.');repeatDisplayStatus();
};
})()">Graceful Terminate</button>
</div>
</td><td>
