<!--
    Config tab - edit duetLapse3.json
    Placeholders: {{configfile}} {{message}} {{sections}} - sections are built from section.html
    saveConfig() and displayConfig() are in index.html. Every input needs name= and data-type= (str, int, bool or list)
    The .config style is in index.html (shared with the Video tab)
-->
<div id="configform" class="config">
<b>Settings file:</b> {{configfile}}<br>
<div class="inline"><button class="button" style="background-color:lime" onclick="saveConfig()">Save</button></div>
<div class="inline"><button class="button" style="background-color:yellow" onclick="displayConfig()">Reload</button></div>
<div id="configmessage">{{message}}</div>
{{sections}}
</div>
