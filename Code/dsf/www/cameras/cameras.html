<!--
    Cameras tab - the camera urls in duetLapse3.json, each with a preview
    Placeholders: {{configfile}} {{cameras}} - cameras are built from camera.html
    previewCamera(), saveCameras() and displayCameras() are in index.html
-->
<style>
.cameras td {padding: 4px 8px; vertical-align: top;}
.cameras .help {color: #444;}
</style>
<div class="cameras">
<b>Settings file:</b> {{configfile}}<br>
<div class="inline"><button class="button" style="background-color:lime" onclick="saveCameras()">Save</button></div>
<div class="inline"><button class="button" style="background-color:yellow" onclick="displayCameras()">Reload</button></div>
<div id="camerasmessage"></div>
<table>{{cameras}}</table>
</div>
