<!-- One camera.  Placeholders: {{number}} {{key}} {{value}} {{help}} {{preview}} -->
<tr>
<td><b>Camera{{number}}</b><br>
<input type="text" id="{{key}}" name="{{key}}" value="{{value}}" size="45"
 onkeydown="if (event.key == 'Enter') {previewCamera({{number}});}"><br>
<span class="help">{{help}}</span><br>
<div class="inline"><button class="button" style="background-color:yellow" onclick="previewCamera({{number}})">Preview</button></div>
</td>
<td id="preview{{number}}">{{preview}}</td>
</tr>
