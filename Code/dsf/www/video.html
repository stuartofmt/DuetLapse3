<!--
    Video tab
    Placeholders: {{fps}} {{minvideo}} {{maxvideo}} {{videomsg}}
-->
<form action="/videosettings" onsubmit="setTimeout(function() {displayVideo();}, 1500)">
<label for="fps">fps:</label>
<input type="text" id="fps" name="fps" value={{fps}} style="background-color:lime; width:30px; border:none" />
<label for="minvideo">minvideo:</label>
<input type="text" id="minvideo" name="minvideo" value={{minvideo}} style="background-color:lime; width:30px; border:none"/>
<label for="maxvideo">maxvideo:</label>
<input type="text" id="maxvideo" name="maxvideo" value={{maxvideo}} style="background-color:lime; width:30px; border:none"/>
<br><br>
<input type="submit" value="Update">
</form><br><b>{{videomsg}}&nbsp;&nbsp;&nbsp;&nbsp;<div class="inline">
<button class="button" style="background-color:yellow" onclick="(async () => {
let promise = await fetch('/snapshot');
let result = await promise.text();
alert(result);
await displayVideo();
})()">Snapshot</button>
</div>
