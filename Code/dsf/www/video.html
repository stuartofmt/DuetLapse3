<!--
    Video tab - make a video now, and the Video and Overrides settings in duetLapse3.json
    Placeholders: {{videomsg}} {{configfile}} {{message}} {{sections}} - sections are built from config/section.html
    saveVideo() and displayVideo() are in index.html. Every input needs name= and data-type= (str, int, bool or list)
-->
<div id="videoform" class="config">
<b>{{videomsg}}</b>&nbsp;&nbsp;&nbsp;&nbsp;<div class="inline">
<button class="button" style="background-color:yellow" onclick="(async () => {
let promise = await fetch('/snapshot');
let result = await promise.text();
alert(result);
await displayVideo();
})()">Snapshot</button>
</div><br>
<b>Settings file:</b> {{configfile}}<br>
<div class="inline"><button class="button" style="background-color:lime" onclick="saveVideo()">Save</button></div>
<div class="inline"><button class="button" style="background-color:yellow" onclick="displayVideo()">Reload</button></div>
<div id="videomessage">{{message}}</div>
{{sections}}
</div>
