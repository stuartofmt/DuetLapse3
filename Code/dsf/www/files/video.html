<!-- Video button (image folders only).  Placeholders: {{path}} -->
<td>
<div class="inline">
<button class="button" style="background-color:green" onclick="(async () => {
let fullname_encoded = encodeURIComponent('{{path}}');
let promise = await fetch(`/makevideo?path=${fullname_encoded}&xtratime=False`);
let result = await promise.text();
alert(result);
await displayFiles(event,'true');
})()">Video</button>
</div>
</td>
